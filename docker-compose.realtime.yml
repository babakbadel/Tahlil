services:
  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BRS_POLL_SECONDS: ${BRS_POLL_SECONDS:-5}
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('REALTIME_PORT','8000') + '/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
