version: 1
model: BabiMind-Dollar-Expert-Ensemble
as_of: 2026-09-02
selection:
  initial_pool_size: 30
  stages: [30, 20, 12, 8, 5]
  minimum_scored_forecasts_before_elimination: 8
  lock_forecast_before_outcome: true
  prevent_hindsight_revision: true
  final_selection:
    slots: 5
    diversity_constraints:
      macro: 1
      technical_market: 1
      political_geopolitical: 1
      structural_fx: 1
      best_overall: 1
  score_weights:
    direction: 0.30
    price_accuracy: 0.30
    timing: 0.15
    regime_detection: 0.15
    consistency: 0.10
  ensemble_weight_method: inverse_recent_error_with_floor
  max_single_expert_weight: 0.35

forecast_horizons:
  - intraday
  - 1d
  - 1w
  - 1m
  - 3m
  - 6m
  - year_end

