scoring:
  dimensions:
    - direction
    - magnitude
    - confidence
    - freshness
    - persistence
    - surprise
    - market_sensitivity
    - transmission_strength
  rules:
    - Each factor must retain source, timestamp, raw_value and normalized_score.
    - Missing data is SKIP and must not be replaced by fabricated values.
    - Stale data receives reduced weight or exclusion from fresh-signal aggregation.
    - Factor weights are dynamic and must be conditioned on market regime.
    - Correlated factors must be de-duplicated or grouped before final aggregation.
    - Final market decisions require cross-layer confirmation.
