name: SourceArena API Probe

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "نماد برای تست SourceArena"
        required: true
        default: "شستا"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Call SourceArena
        env:
          SOURCEARENA_TOKEN: ${{ secrets.SOURCEARENA_TOKEN }}
        run: |
          python scripts/sourcearena_probe.py --name "${{ inputs.symbol }}"
