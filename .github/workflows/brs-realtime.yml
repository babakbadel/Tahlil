name: BRS Realtime Options

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: brs-realtime
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
      BRS_POLL_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner Python
        run: |
          python3 --version
          python3 -m pip --version
          echo "PYTHONPATH=$PYTHONPATH"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-realtime.txt

      - name: Validate secret
        run: |
          test -n "$BRS_API_KEY" || { echo 'BRS_API_KEY repository secret is missing'; exit 1; }

      - name: Collect realtime all-options snapshot
        run: |
          mkdir -p artifacts
          python3 -c "import app; print('app import OK')"
          python3 scripts/fetch_options_realtime.py --output artifacts/options_realtime.json

      - name: Validate JSON
        run: python3 -m json.tool artifacts/options_realtime.json >/dev/null

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: options-realtime-${{ github.run_id }}
          path: artifacts/options_realtime.json
          retention-days: 7
