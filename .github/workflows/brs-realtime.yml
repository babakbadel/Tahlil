name: BRS Realtime Options

on:
  # Automatic collection during the Iranian market session.
  # No manual workflow execution is required.
  schedule:
    - cron: '0,30 8-12 * * *'
      timezone: 'Asia/Tehran'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brs-realtime
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
      BRS_POLL_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-realtime.txt

      - name: Validate secret
        run: |
          test -n "$BRS_API_KEY" || { echo 'BRS_API_KEY repository secret is missing'; exit 1; }

      - name: Collect realtime all-options snapshot
        run: |
          mkdir -p artifacts data/latest data/final
          python3 -c "import app; print('app import OK')"
          python3 scripts/fetch_options_realtime.py --output artifacts/options_realtime.json

      - name: Validate JSON
        run: python3 -m json.tool artifacts/options_realtime.json >/dev/null

      - name: Publish persistent latest snapshot
        run: |
          cp artifacts/options_realtime.json data/latest/options_realtime.json

      - name: Freeze final snapshot at 12:30
        run: |
          HOUR=$(TZ=Asia/Tehran date +%H)
          MINUTE=$(TZ=Asia/Tehran date +%M)
          DATE=$(TZ=Asia/Tehran date +%F)
          if [ "$HOUR" = "12" ] && [ "$MINUTE" = "30" ]; then
            mkdir -p "data/final/$DATE"
            cp artifacts/options_realtime.json "data/final/$DATE/options_realtime.json"
          fi

      - name: Commit latest and final snapshots
        run: |
          git config user.name 'tahlil-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest data/final
          git diff --cached --quiet || git commit -m "data: update options snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: options-realtime-${{ github.run_id }}
          path: artifacts/options_realtime.json
          retention-days: 7
