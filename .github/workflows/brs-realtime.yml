name: BRS Realtime Options

on:
  # Automatic collection during the Iranian market session.
  # Iran is UTC+03:30; using UTC here avoids workflow parser/preview issues.
  # 08:00..12:30 Tehran = 04:30..09:00 UTC.
  schedule:
    - cron: '30 4-8 * * 0-3,6'
    - cron: '0 5-9 * * 0-3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brs-realtime
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
      BRS_POLL_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-realtime.txt

      - name: Collect realtime all-options snapshot (skip if API unavailable)
        id: collect
        continue-on-error: true
        run: |
          mkdir -p artifacts data/latest data/final
          if [ -z "$BRS_API_KEY" ]; then
            echo 'BRS API unavailable: secret is missing. SKIP.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 -c "import app; print('app import OK')"
          if python3 scripts/fetch_options_realtime.py --output artifacts/options_realtime.json; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'BRS API unavailable/failed. SKIP and continue pipeline.'
            rm -f artifacts/options_realtime.json
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Validate JSON
        if: steps.collect.outputs.available == 'true'
        run: python3 -m json.tool artifacts/options_realtime.json >/dev/null

      - name: Publish persistent latest snapshot
        if: steps.collect.outputs.available == 'true'
        run: cp artifacts/options_realtime.json data/latest/options_realtime.json

      - name: Freeze final snapshot at 12:30
        if: steps.collect.outputs.available == 'true'
        run: |
          HOUR=$(TZ=Asia/Tehran date +%H)
          MINUTE=$(TZ=Asia/Tehran date +%M)
          DATE=$(TZ=Asia/Tehran date +%F)
          if [ "$HOUR" = "12" ] && [ "$MINUTE" = "30" ]; then
            mkdir -p "data/final/$DATE"
            cp artifacts/options_realtime.json "data/final/$DATE/options_realtime.json"
          fi

      - name: Commit latest and final snapshots
        if: steps.collect.outputs.available == 'true'
        run: |
          git config user.name 'tahlil-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest data/final
          git diff --cached --quiet || git commit -m "data: update options snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1

      - name: Publish artifact
        if: steps.collect.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-realtime-${{ github.run_id }}
          path: artifacts/options_realtime.json
          retention-days: 7
