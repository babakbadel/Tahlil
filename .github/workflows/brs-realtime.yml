name: BRS Realtime Options

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: brs-realtime
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
      BRS_POLL_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-realtime.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-realtime.txt

      - name: Validate secret
        run: |
          test -n "$BRS_API_KEY" || { echo 'BRS_API_KEY repository secret is missing'; exit 1; }

      - name: Collect realtime ZMLI snapshot
        run: |
          mkdir -p artifacts
          python scripts/fetch_zmli_realtime.py --output artifacts/zmli_realtime.json

      - name: Validate JSON
        run: python -m json.tool artifacts/zmli_realtime.json >/dev/null

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmli-realtime-${{ github.run_id }}
          path: artifacts/zmli_realtime.json
          retention-days: 7
