name: Graphify Index & Verify

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  GEMINI_MODEL: gemini-flash-latest

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Graphify and Gemini runtime dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv tool install 'graphifyy[gemini]' --with openai --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Gemini configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY secret is missing'; exit 1; }
          echo 'Gemini API key is configured.'

      - name: Verify Graphify runtime dependencies
        run: |
          which graphify
          graphify --help >/dev/null
          GRAPHIFY_BIN="$(which graphify)"
          GRAPHIFY_PY="$(head -n 1 "$GRAPHIFY_BIN" | sed 's/^#!//')"
          echo "Graphify executable: $GRAPHIFY_BIN"
          echo "Graphify runtime: $GRAPHIFY_PY"
          "$GRAPHIFY_PY" -c "import openai; print('OpenAI dependency: OK')"
          echo 'Graphify Gemini runtime: OK'

      - name: Run Graphify on Tahlil
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
        run: graphify . --update

      - name: Validate graph output
        run: |
          test -d graphify-out
          test -s graphify-out/graph.json
          echo 'Graphify graph output: OK'
          ls -lh graphify-out/

      - name: Upload Graphify output
        uses: actions/upload-artifact@v4
        with:
          name: graphify-output
          path: graphify-out/
          if-no-files-found: error
          retention-days: 7

      - name: Verify BabiMind Graphify skill
        run: test -s .agents/skills/graphify/SKILL.md
