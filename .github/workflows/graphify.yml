name: Graphify Index & Verify

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade graphifyy

      - name: Verify Graphify
        run: |
          python -c "import graphify; print('Graphify import: OK')"
          graphify --help >/dev/null
          echo 'Graphify CLI: OK'

      - name: Run Graphify on Tahlil
        run: |
          graphify . --update

      - name: Validate graph output
        run: |
          test -d graphify-out
          test -s graphify-out/graph.json
          echo 'Graphify graph output: OK'
          ls -lh graphify-out/

      - name: Upload Graphify output
        uses: actions/upload-artifact@v4
        with:
          name: graphify-output
          path: graphify-out/
          if-no-files-found: error
          retention-days: 7

      - name: Verify BabiMind Graphify skill
        run: test -s .agents/skills/graphify/SKILL.md
