name: BabiMind Historical Forecast Backfill

on:
  workflow_dispatch:
    inputs:
      symbol_shards:
        description: Number of symbol shards
        required: false
        default: '8'
      symbol_limit_per_shard:
        description: Optional per-shard cap for a staged rollout
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: babimind-historical-backfill
  cancel-in-progress: false

jobs:
  indices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/babimind-historical-forecasting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas requests
      - run: python scripts/historical_backfill.py --kind indices
      - uses: actions/upload-artifact@v4
        with:
          name: babimind-index-history
          path: data/historical/index_*.csv.gz
          retention-days: 30

  symbols:
    needs: indices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/babimind-historical-forecasting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas requests
      - name: Backfill symbol shard
        env:
          SHARDS: ${{ inputs.symbol_shards || '8' }}
          LIMIT: ${{ inputs.symbol_limit_per_shard || '0' }}
        run: python scripts/historical_backfill.py --kind symbols --shard ${{ matrix.shard }} --shards "$SHARDS" --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: babimind-symbol-history-${{ matrix.shard }}
          path: data/historical/symbols_shard_*.csv.gz
          if-no-files-found: error
          retention-days: 30
