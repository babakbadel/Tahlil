name: BabiMind Global and Macro

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  global-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Run global market layer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -f scripts/babimind_global_market.py ]; then
            python scripts/babimind_global_market.py --config config/babimind_global_market_map.yml
          else
            echo 'Global market script unavailable; no synthetic data will be created.'
          fi
      - name: Commit macro outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ data/raw/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'chore: refresh global and macro intelligence' && git push origin HEAD:main)
