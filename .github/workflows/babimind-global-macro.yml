name: BabiMind Global and Macro

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: write

jobs:
  global-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Run global market layer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -f scripts/babimind_global_market.py ]; then
            python scripts/babimind_global_market.py --config config/babimind_global_market_map.yml
          else
            echo 'Global market script unavailable; no synthetic data will be created.'
          fi
      - name: Commit macro outputs
        if: always()
        run: |
          python scripts/commit_outputs.py 'chore: refresh global and macro intelligence'
