name: BabiMind Unified Source Intelligence

on:
  schedule:
    - cron: '15 7 */4 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babimind-source-pipeline
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-flash-latest

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Graphify with Gemini support
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'graphifyy[gemini]'
          python -m pip install --upgrade openai

      - name: Validate Gemini configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY secret is missing'; exit 1; }
          echo 'Gemini API key is configured.'

      - name: Run Graphify incremental index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
        run: graphify . --update

      - name: Run Graph Intelligence adapter
        run: python scripts/babimind_graph.py

      - name: Run unified BabiMind pipeline
        run: python scripts/babimind_pipeline.py

      - name: Run Gemini BabiMind reasoning
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
        run: python scripts/babimind_gemini.py

      - name: Validate integrated model outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('graphify-out/graph.json'),
              Path('reports/babimind_graph.json'),
              Path('reports/babimind_pipeline.json'),
              Path('reports/babimind_gemini.json'),
          ]
          for p in required:
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing/empty model output: {p}')
          gem = json.loads(Path('reports/babimind_gemini.json').read_text())
          analysis = gem.get('analysis', {})
          for key in ('regime','scenarios','game_theory','dynamic_system','political_economy','market_implications','confidence','data_gaps'):
              if key not in analysis:
                  raise SystemExit(f'Gemini output missing required key: {key}')
          print('Integrated BabiMind outputs: OK')
          print('Scenario count:', len(analysis.get('scenarios', [])))
          print('Confidence:', analysis.get('confidence'))
          PY

      - name: Commit BabiMind + Graph + Gemini reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/babimind_pipeline.json reports/babimind_graph.json reports/babimind_gemini.json graphify-out/
          git diff --cached --quiet || git commit -m 'chore: refresh integrated BabiMind intelligence'
          git push
