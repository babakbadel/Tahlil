name: BabiMind Unified Source Intelligence

on:
  schedule:
    - cron: '15 7 */4 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babimind-source-pipeline
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-flash-latest
  OPENROUTER_MODEL: openrouter/free

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'graphifyy[gemini]' openai

      - name: Check OpenRouter configuration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo 'ERROR: OPENROUTER_API_KEY GitHub Secret is missing.'
            exit 1
          fi
          echo 'OpenRouter API key: configured'

      - name: Graphify incremental index
        id: graphify
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
        run: |
          set -o pipefail
          graphify . --update 2>&1 | tee graphify.log
          status=${PIPESTATUS[0]}
          if grep -Eiq '429|RESOURCE_EXHAUSTED|quota exceeded|quota.*limit|current quota|free_tier' graphify.log; then
            echo 'quota_exhausted=true' >> "$GITHUB_OUTPUT"
            echo '::warning::GEMINI QUOTA EXHAUSTED — semantic Graphify skipped; continuing with local extraction.'
          else
            echo 'quota_exhausted=false' >> "$GITHUB_OUTPUT"
          fi
          exit $status

      - name: Graphify local/code fallback
        if: steps.graphify.outcome == 'failure'
        run: |
          echo 'Graphify semantic extraction failed. Running local code-only extraction so BabiMind can continue.'
          graphify . --code-only || true

      - name: Build graph intelligence
        run: python scripts/babimind_graph.py

      - name: Run unified source pipeline
        run: python scripts/babimind_pipeline.py

      - name: Build OpenRouter prompt from current BabiMind data
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('reports/babimind_pipeline.json'), Path('reports/babimind_graph.json')]
          parts = [
              'You are BabiMind, the central financial and economic intelligence model for Tahlil.',
              'Use the supplied CURRENT repository intelligence as evidence.',
              'Integrate Iran stock market, gold, dollar, macroeconomics, political economy, game theory and dynamic systems.',
              'Generate scenario probabilities and explain feedback loops, strategic actors, incentives and regime changes.',
              'Do not invent unavailable observations. Separate evidence, inference and uncertainty.',
              'Return valid JSON with exactly these top-level keys: regime, scenarios, game_theory, dynamic_system, political_economy, market_implications, confidence, data_gaps.'
          ]
          for p in files:
              if p.exists():
                  text=p.read_text(encoding='utf-8')
                  if len(text)>90000: text=text[:90000]+'\n[TRUNCATED]'
                  parts.append(f'\nSOURCE FILE: {p}\n{text}')
          Path('babimind_openrouter_prompt.txt').write_text('\n'.join(parts),encoding='utf-8')
          PY

      - name: Run BabiMind on OpenRouter Free
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ env.OPENROUTER_MODEL }}
        run: |
          python scripts/babimind_llm_router.py \
            --prompt-file babimind_openrouter_prompt.txt \
            --output reports/babimind_llm.json

      - name: Report provider status
        if: always()
        run: |
          if [ -f reports/babimind_provider_status.json ]; then
            cat reports/babimind_provider_status.json
          fi
          if [ -f graphify.log ] && grep -Eiq '429|RESOURCE_EXHAUSTED|quota exceeded|quota.*limit|free_tier' graphify.log; then
            echo '::warning::Gemini quota exhausted. BabiMind continued through local extraction + OpenRouter.'
          fi

      - name: Validate BabiMind outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in ('reports/babimind_graph.json','reports/babimind_pipeline.json','reports/babimind_llm.json'):
              q=Path(p)
              if not q.exists() or q.stat().st_size == 0:
                  raise SystemExit(f'Missing/empty output: {p}')
          d=json.loads(Path('reports/babimind_llm.json').read_text(encoding='utf-8'))
          if d.get('status') != 'ok':
              raise SystemExit('OpenRouter inference did not produce a valid BabiMind result')
          required=('regime','scenarios','game_theory','dynamic_system','political_economy','market_implications','confidence','data_gaps')
          missing=[k for k in required if k not in d.get('analysis',{})]
          if missing:
              raise SystemExit(f'BabiMind output missing keys: {missing}')
          print(f"BabiMind OK: provider={d.get('provider')} model={d.get('model')}")
          PY

      - name: Commit BabiMind reports
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ graphify-out/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh BabiMind OpenRouter intelligence' || true
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
