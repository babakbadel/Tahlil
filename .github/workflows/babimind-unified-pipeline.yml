name: BabiMind Daily Intelligence

on:
  schedule:
    - cron: '15 7 * * 0,1,2,3,4,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babimind-daily
  cancel-in-progress: false

env:
  OPENROUTER_MODEL: openrouter/free
  TSE_OPTION_REPO: https://github.com/sm-sokout/tse-option.git
  TSE_OPTION_REF: master

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade graphifyy
          python -m pip install -r requirements-finpy-tse.txt
      - name: Collect current market data
        continue-on-error: true
        env:
          FINPY_TSE_SYMBOLS: 'فملی,وبملت,شپنا,خساپا'
          FINPY_TSE_LOOKBACK_DAYS: '30'
        run: python scripts/collect_finpy_tse.py
      - name: Ingest market snapshots
        run: |
          python scripts/ingest_option_market_watch.py
          python scripts/ingest_marketwatch_plus.py
          python scripts/ingest_tse_option.py
      - name: Global and macro layer
        continue-on-error: true
        run: |
          if [ -f scripts/babimind_global_market.py ]; then python scripts/babimind_global_market.py --config config/babimind_global_market_map.yml; fi
      - name: Graph intelligence
        continue-on-error: true
        run: |
          graphify . --code-only --update || true
          python scripts/babimind_graph.py
      - name: Unified BabiMind pipeline
        run: python scripts/babimind_pipeline.py
      - name: Prepare memory
        run: python scripts/babimind_memory.py --prepare
      - name: Build LLM prompt and run BabiMind
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'reports/babimind_pipeline.json','reports/babimind_graph.json','reports/babimind_memory_context.json',
              'data/raw/finpy_tse_snapshot.json','data/raw/option_market_watch_snapshot.json',
              'reports/option_market_watch_summary.json','data/raw/marketwatch_plus_snapshot.json',
              'reports/marketwatch_plus_summary.json','data/raw/tse_option_snapshot.json',
              'reports/tse_option_source_status.json'
          ]
          parts = ['You are BabiMind, the central financial and economic intelligence model for Tahlil. Use current repository intelligence as primary evidence and memory only for historical calibration. Do not invent missing observations, Greeks or timestamps. Separate evidence, inference and uncertainty. Integrate Iran stocks, options, gold, dollar, macroeconomics, political economy, game theory and dynamic systems. Return valid JSON with keys: regime, scenarios, game_theory, dynamic_system, political_economy, market_implications, confidence, data_gaps.']
          for f in files:
              p=Path(f)
              if p.exists():
                  t=p.read_text(encoding='utf-8')
                  parts.append(f'\nSOURCE FILE: {f}\n{t[:70000]}')
          Path('babimind_openrouter_prompt.txt').write_text('\n'.join(parts),encoding='utf-8')
          PY
          test -n "$OPENROUTER_API_KEY"
          python scripts/babimind_llm_router.py --prompt-file babimind_openrouter_prompt.txt --output reports/babimind_llm.json
      - name: Ingest successful memory
        run: python scripts/babimind_memory.py --ingest
      - name: Validate and commit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in ['reports/babimind_graph.json','reports/babimind_pipeline.json']:
              if not Path(p).exists(): raise SystemExit(f'Missing output: {p}')
          if Path('reports/babimind_llm.json').exists(): json.loads(Path('reports/babimind_llm.json').read_text(encoding='utf-8'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ graphify-out/ data/raw/finpy_tse_snapshot.json data/raw/option_market_watch_snapshot.json data/raw/marketwatch_plus_snapshot.json data/raw/tse_option_snapshot.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'chore: refresh BabiMind daily intelligence' && git push origin HEAD:main)
