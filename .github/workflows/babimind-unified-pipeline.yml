name: BabiMind Daily Intelligence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/babimind-unified-pipeline.yml'
  schedule:
    # Iran time: 08:00, 11:00, 12:40 (UTC+3:30), Saturday-Thursday
    - cron: '30 4 * * 0,1,2,3,4,6'
    - cron: '30 7 * * 0,1,2,3,4,6'
    - cron: '10 9 * * 0,1,2,3,4,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babimind-daily
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  OPENROUTER_MODEL: openrouter/free
  TSE_OPTION_REPO: https://github.com/sm-sokout/tse-option.git
  TSE_OPTION_REF: master

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade graphifyy
          if [ -f requirements-finpy-tse.txt ]; then python -m pip install -r requirements-finpy-tse.txt || true; fi
          if [ -f requirements-market-data.txt ]; then python -m pip install -r requirements-market-data.txt || true; fi

      - name: Collect Kamandar market report
        continue-on-error: true
        run: python scripts/collect_kamandar_market_report.py

      - name: Collect Kamandar indices and breadth
        continue-on-error: true
        run: python scripts/collect_kamandar_indices.py

      - name: Collect Kamandar market sections
        continue-on-error: true
        run: python scripts/collect_kamandar_market_sections.py

      - name: Crawl Kamandar services and linked pages
        continue-on-error: true
        run: python scripts/collect_kamandar_services.py

      - name: Collect current market data
        continue-on-error: true
        env:
          FINPY_TSE_SYMBOLS: 'فملی,وبملت,شپنا,خساپا'
          FINPY_TSE_LOOKBACK_DAYS: '730'
        run: python scripts/collect_finpy_tse.py

      - name: Collect BRS option feed
        continue-on-error: true
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: python -m scripts.fetch_options_realtime --output data/raw/brs_options_snapshot.json

      - name: Collect adjusted history for model inference
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: python -m scripts.collect_brs_history

      - name: Ingest market and option snapshots
        run: |
          python scripts/ingest_option_market_watch.py
          python scripts/ingest_marketwatch_plus.py
          python scripts/ingest_tse_option.py

      - name: Refresh source health and confidence
        run: |
          python scripts/babimind_source_health.py
          python scripts/babimind_source_confidence.py || true

      - name: Collect daily economic news and Pezeshkian evidence
        continue-on-error: true
        run: |
          python scripts/babimind_daily_economic_news.py
          python scripts/babimind_pezeshkian_news.py

      - name: Global and macro layer
        continue-on-error: true
        run: |
          if [ -f scripts/babimind_global_market.py ]; then python scripts/babimind_global_market.py --config config/babimind_global_market_map.yml; fi

      - name: Factor coverage and weights
        continue-on-error: true
        run: |
          python scripts/babimind_factor_coverage.py
          python scripts/babimind_signal_weight.py

      - name: Graph intelligence
        continue-on-error: true
        run: |
          graphify . --code-only --update || true
          python scripts/babimind_graph.py

      - name: Daily option ranking and factor rotation
        continue-on-error: true
        run: |
          python scripts/rank_options_babimind.py
          python scripts/score_options_babimind_scenarios.py
          python scripts/risk_adjusted_options_babimind.py
          python scripts/babimind_factor_rotation.py

      - name: Forecast, backtest and record sourced decisions
        run: python -m scripts.run_model_runtime

      - name: Unified BabiMind pipeline
        run: python scripts/babimind_pipeline.py

      - name: Prepare memory
        run: python scripts/babimind_memory.py --prepare

      - name: Build master Web Research + Decision prompt and run LLM
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          prompt = Path('docs/master-web-research-decision-agent.md')
          if not prompt.exists():
              raise SystemExit('Missing canonical master prompt')
          files = [
              'reports/babimind_forecast.json',
              'reports/babimind_decision.json',
              'reports/babimind_pipeline.json',
              'reports/babimind_graph.json',
              'reports/babimind_memory_context.json',
              'reports/babimind_source_health.json',
              'reports/babimind_factor_coverage.json',
              'reports/babimind_factor_rotation.json',
              'reports/babimind_signal_weights.json',
              'reports/option_market_watch_summary.json',
              'reports/marketwatch_plus_summary.json',
              'reports/tse_option_source_status.json',
              'reports/tse_option_ingest_status.json',
              'reports/options_babimind_ranked.json',
              'reports/options_babimind_scenario_ranked.json',
              'reports/options_babimind_risk_adjusted.json',
              'reports/babimind_model_stage_status.json',
              'data/raw/finpy_tse_snapshot.json',
              'data/raw/option_market_watch_snapshot.json',
              'data/raw/marketwatch_plus_snapshot.json',
              'data/raw/tse_option_snapshot.json',
              'data/raw/brs_options_snapshot.json',
              'data/raw/kamandar_market_report.json',
              'data/raw/kamandar_indices.json',
              'data/raw/kamandar_stocks.json',
              'data/raw/kamandar_funds.json',
              'data/raw/kamandar_options.json',
              'data/raw/kamandar_options_top_put.json',
              'data/raw/kamandar_baskets.json',
              'data/raw/kamandar_services_crawl.json',
              'artifacts/babimind_global_market_snapshot.json',
              'artifacts/babimind_daily_economic_news.json',
              'artifacts/babimind_pezeshkian_news.json',
              'memory/news-daily-latest.md',
          ]
          parts = [prompt.read_text(encoding='utf-8')]
          parts.append('\n## CURRENT REPOSITORY EVIDENCE\n')
          for f in files:
              p = Path(f)
              if p.exists():
                  parts.append(f'\nSOURCE FILE: {f}\n{p.read_text(encoding="utf-8", errors="replace")[:70000]}')
          Path('babimind_openrouter_prompt.txt').write_text('\n'.join(parts), encoding='utf-8')
          PY
          python scripts/babimind_llm_router.py --prompt-file babimind_openrouter_prompt.txt --output reports/babimind_llm.json

      - name: Ingest successful memory
        run: python scripts/babimind_memory.py --ingest

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babimind-${{ github.run_id }}
          path: |
            reports/
            artifacts/
          retention-days: 14

      - name: Validate and commit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['reports/babimind_graph.json','reports/babimind_pipeline.json']
          missing=[p for p in required if not Path(p).exists()]
          if missing: raise SystemExit(f'Missing required output: {missing}')
          if Path('reports/babimind_llm.json').exists(): json.loads(Path('reports/babimind_llm.json').read_text(encoding='utf-8'))
          PY
          python scripts/commit_outputs.py 'chore: refresh BabiMind daily brain'
