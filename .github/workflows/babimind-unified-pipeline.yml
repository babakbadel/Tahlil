name: BabiMind Unified Source Intelligence

on:
  schedule:
    - cron: '15 7 */4 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babimind-source-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unified pipeline
        run: python scripts/babimind_pipeline.py
      - name: Commit pipeline report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/babimind_pipeline.json
          git diff --cached --quiet || git commit -m 'chore: refresh BabiMind unified source pipeline'
          git push
