name: BabiMind Option Ranking

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 5-9 * * 6,0,1,2,3'

permissions:
  contents: write

jobs:
  rank-options:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rank realtime options
        run: python scripts/rank_options_babimind.py

      - name: Scenario scoring
        run: python scripts/score_options_babimind_scenarios.py

      - name: Commit BabiMind rankings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/options_babimind_ranked.json reports/options_babimind_ranked.md reports/options_babimind_scenario_ranked.json reports/options_babimind_scenario_ranked.md
          git diff --cached --quiet || git commit -m 'chore: refresh BabiMind option scenario ranking'
          git push
