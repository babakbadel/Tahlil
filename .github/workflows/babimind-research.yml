name: BabiMind Research and Factor Discovery

on:
  schedule:
    - cron: '15 7 */4 * *'
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  AGENT_REACH_REF: da5044d26fc6adddb6554d5679c94ac22e76e428

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Agent Reach
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Panniantong/Agent-Reach.git@${AGENT_REACH_REF}"

      - name: Agent Reach health check
        continue-on-error: true
        run: python scripts/collect_agent_reach.py

      - name: Factor discovery and coverage
        continue-on-error: true
        run: |
          if [ -f scripts/babimind_factor_discovery.py ]; then python scripts/babimind_factor_discovery.py; fi
          if [ -f scripts/babimind_factor_coverage.py ]; then python scripts/babimind_factor_coverage.py; fi

      - name: Commit research outputs
        if: always()
        run: |
          python scripts/commit_outputs.py 'chore: refresh BabiMind research and Agent Reach health'
