name: FinPy-TSE Daily Source

on:
  workflow_dispatch:
  schedule:
    # 09:00 and 12:00 Iran time (UTC+3:30)
    - cron: '30 5 * * *'
    - cron: '30 8 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FinPy-TSE
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-finpy-tse.txt

      - name: Collect market data
        env:
          FINPY_TSE_SYMBOLS: 'فملی,وبملت,شپنا,خساپا'
          FINPY_TSE_LOOKBACK_DAYS: '30'
        run: python scripts/collect_finpy_tse.py

      - name: Commit model-ready snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/finpy_tse_snapshot.json
          git diff --cached --quiet || git commit -m 'data: refresh FinPy-TSE market snapshot'
          git push
