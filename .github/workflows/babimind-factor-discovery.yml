name: BabiMind Hidden Factor Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 0-6'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run discovery scan
        run: python scripts/babimind_factor_discovery.py | tee factor-discovery.log

      - name: Commit discovery artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/factor_discovery_latest.json
          git diff --cached --quiet || git commit -m 'chore(babimind): update factor discovery artifact'
          git push
