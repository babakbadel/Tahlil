name: BRS Market Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan all market symbols
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: |
          python scan_market.py

      - name: Upload market data
        uses: actions/upload-artifact@v4
        with:
          name: brs-market-data-${{ github.run_number }}
          path: |
            data/all_symbols.json
            data/all_symbols.csv
          retention-days: 7
