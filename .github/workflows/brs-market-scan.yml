name: BRS Market Scan

on:
  schedule:
    # Automatic market snapshot; no manual trigger required.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brs-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run market scanner
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: |
          python scan_market.py

      - name: Validate JSON
        run: python -m json.tool data/all_symbols.json >/dev/null

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: brs-market-json-${{ github.run_id }}
          path: data/all_symbols.json
          retention-days: 7

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: brs-market-csv-${{ github.run_id }}
          path: data/all_symbols.csv
          retention-days: 7
