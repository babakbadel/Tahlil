name: BRS Market Scan

on:
  # Automatic market snapshots during the Iranian market session.
  # Iran is UTC+03:30; 08:00..12:30 Tehran = 04:30..09:00 UTC.
  schedule:
    - cron: '30 4-8 * * 0-3,6'
    - cron: '0 5-9 * * 0-3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brs-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run market scanner
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: python scan_market.py

      - name: Validate JSON
        run: python -m json.tool data/all_symbols.json >/dev/null

      - name: Publish persistent latest snapshot
        run: |
          mkdir -p data/latest data/final
          cp data/all_symbols.json data/latest/all_symbols.json
          cp data/all_symbols.csv data/latest/all_symbols.csv

      - name: Freeze final snapshot at 12:30
        run: |
          HOUR=$(TZ=Asia/Tehran date +%H)
          MINUTE=$(TZ=Asia/Tehran date +%M)
          DATE=$(TZ=Asia/Tehran date +%F)
          if [ "$HOUR" = "12" ] && [ "$MINUTE" = "30" ]; then
            mkdir -p "data/final/$DATE"
            cp data/all_symbols.json "data/final/$DATE/all_symbols.json"
            cp data/all_symbols.csv "data/final/$DATE/all_symbols.csv"
          fi

      - name: Commit latest and final snapshots
        run: |
          git config user.name 'tahlil-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest data/final
          git diff --cached --quiet || git commit -m "data: update market snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: brs-market-json-${{ github.run_id }}
          path: data/all_symbols.json
          retention-days: 7

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: brs-market-csv-${{ github.run_id }}
          path: data/all_symbols.csv
          retention-days: 7
