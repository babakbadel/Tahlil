name: Kamandar Only Daily

on:
  push:
    paths:
      - 'scripts/kamandar_only_report.py'
      - '.github/workflows/kamandar-only.yml'
      - 'app/**'
      - 'package.json'
  schedule:
    - cron: '30 4 * * 0,1,2,3,4,6'
    - cron: '30 7 * * 0,1,2,3,4,6'
    - cron: '10 9 * * 0,1,2,3,4,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kamandar-only-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect market report
        continue-on-error: true
        run: python scripts/collect_kamandar_market_report.py
      - name: Collect indices
        continue-on-error: true
        run: python scripts/collect_kamandar_indices.py
      - name: Collect six market sections
        continue-on-error: true
        run: python scripts/collect_kamandar_market_sections.py
      - name: Crawl services and linked pages
        continue-on-error: true
        run: python scripts/collect_kamandar_services.py
      - name: Build Kamandar-only manifest
        run: python scripts/kamandar_only_report.py
      - name: Commit Kamandar layer
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/kamandar_*.json reports/kamandar_*.json
          git diff --cached --quiet || (git commit -m 'chore: refresh Kamandar-only intelligence' && git push origin HEAD:main)
