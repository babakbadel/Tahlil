name: TSE Market and Options Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tse-market-options.yml'
      - 'scripts/ingest_tse_option.py'
      - 'scripts/rank_options_babimind.py'
      - 'scripts/collect_algotik_tse.py'
      - 'scripts/collect_tsetmc_async.py'
      - 'scripts/collect_tsetmc_option_api.py'
      - 'scripts/collect_pytsetmc_api.py'
      - 'scripts/collect_pypihat_tsetmc_api.py'
      - 'requirements-market-data.txt'
      - 'requirements.txt'
  schedule:
    - cron: '*/30 5-9 * * 6,0,1,2,3'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  ALGOTIK_FETCH_OI: 'true'

jobs:
  market-options:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install data stack
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pandas numpy scipy requests jalali_pandas
          if [ -f requirements-market-data.txt ]; then python -m pip install -r requirements-market-data.txt; fi
      - name: Install legacy pypiHat provider
        continue-on-error: true
        run: |
          python -m venv .venv-pypihat
          .venv-pypihat/bin/python -m pip install "git+https://github.com/pypiHat/tsetmc-api.git@7b2402a2f859af4353f834e44eb0d9e1dc8cc6cd"
      - name: Collect alternative provider - pypiHat/tsetmc-api
        continue-on-error: true
        env:
          PYPIHAT_TSETMC_OUT: data/raw/pypihat_tsetmc_snapshot.json
        run: timeout 180s .venv-pypihat/bin/python scripts/collect_pypihat_tsetmc_api.py
      - name: Collect alternative provider - algotik_tse
        continue-on-error: true
        env:
          OPTION_UNDERLYINGS: 'فملی,ذوب,وبملت,شپنا,خساپا,فولاد,فغدیر,سرچشمه'
          ALGOTIK_FETCH_OI: 'true'
        run: timeout 180s python scripts/collect_algotik_tse.py
      - name: Install async TSETMC provider
        continue-on-error: true
        run: python -m pip install tsetmc
      - name: Collect alternative provider - 5j9/tsetmc
        continue-on-error: true
        run: timeout 180s python scripts/collect_tsetmc_async.py
      - name: Install pytsetmc provider
        continue-on-error: true
        run: python -m pip install pytsetmc-api
      - name: Collect alternative provider - pytsetmc-api
        continue-on-error: true
        run: timeout 180s python scripts/collect_pytsetmc_api.py
      - name: Collect alternative provider - TSETMC_OPTION API
        continue-on-error: true
        run: timeout 180s python scripts/collect_tsetmc_option_api.py
      - name: Collect BRS option feed
        continue-on-error: true
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: python -m scripts.fetch_options_realtime --output data/raw/brs_options_snapshot.json

      - name: Validate provider snapshots
        run: python scripts/validate_market_sources.py
      - name: Ingest and rank options
        continue-on-error: true
        run: |
          python scripts/ingest_option_market_watch.py || true
          python scripts/ingest_marketwatch_plus.py || true
          python scripts/ingest_tse_option.py || true
          python scripts/rank_options_babimind.py || true
          python scripts/score_options_babimind_scenarios.py || true
          python scripts/risk_adjusted_options_babimind.py || true
      - name: Preserve provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-sources-${{ github.run_id }}
          path: |
            data/raw/
            reports/
          retention-days: 14
      - name: Commit outputs
        if: always()
        run: |
          python scripts/commit_outputs.py 'data: refresh TSE market and option intelligence'
