name: TSE Market and Options Live

on:
  schedule:
    - cron: '*/30 5-9 * * 6,0,1,2,3'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Underlying symbol'
        required: true
        default: 'فملی'
        type: string
      include_greeks:
        description: 'Calculate IV/BSM/Leverage where supported'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  market-options:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install data stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy requests jalali_pandas
          python -m pip install -r requirements-finpy-tse.txt
      - name: Install tse-option
        run: |
          git clone --depth 1 --branch master https://github.com/sm-sokout/tse-option.git .cache/tse-option
          python -m pip install -e .cache/tse-option
      - name: Collect market data
        continue-on-error: true
        env:
          FINPY_TSE_SYMBOLS: 'فملی,وبملت,شپنا,خساپا'
          FINPY_TSE_LOOKBACK_DAYS: '30'
        run: python scripts/collect_finpy_tse.py
      - name: Collect option chain
        env:
          OPTION_SYMBOL: ${{ inputs.symbol || 'فملی' }}
          OPTION_INCLUDE_GREEKS: ${{ inputs.include_greeks || 'true' }}
        run: python scripts/collect_tse_option_chain.py
      - name: Ingest and rank options
        run: |
          python scripts/ingest_option_market_watch.py
          python scripts/ingest_marketwatch_plus.py
          python scripts/ingest_tse_option.py
          python scripts/rank_options_babimind.py
          python scripts/score_options_babimind_scenarios.py
          python scripts/risk_adjusted_options_babimind.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/ reports/options_babimind* reports/marketwatch_plus_summary.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'data: refresh TSE market and option intelligence' && git push origin HEAD:main)
