name: TSE Market and Options Live

on:
  push:
    paths:
      - '.github/workflows/tse-market-options.yml'
      - 'scripts/collect_tse_option_chain.py'
      - 'scripts/ingest_tse_option.py'
      - 'scripts/rank_options_babimind.py'
      - 'scripts/collect_algotik_tse.py'
      - 'scripts/collect_tsetmc_async.py'
      - 'scripts/collect_tsetmc_option_api.py'
      - 'requirements-market-data.txt'
  schedule:
    - cron: '*/30 5-9 * * 6,0,1,2,3'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Underlying symbol'
        required: true
        default: 'فملی'
        type: string
      include_greeks:
        description: 'Try IV/BSM/Leverage, then fall back to raw chain'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  TSE_OPTION_TIMEOUT_SECONDS: '60'
  OPTION_TRADING_DAYS: '100'

jobs:
  market-options:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install data stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy requests jalali_pandas
          python -m pip install -r requirements-finpy-tse.txt
          python -m pip install -r requirements-market-data.txt
      - name: Install tse-option
        run: |
          rm -rf .cache/tse-option
          git clone --depth 1 --branch master https://github.com/sm-sokout/tse-option.git .cache/tse-option
          python -m pip install -e .cache/tse-option
      - name: Collect market data (legacy FinPy)
        continue-on-error: true
        env:
          FINPY_TSE_SYMBOLS: 'فملی,وبملت,شپنا,خساپا'
          FINPY_TSE_LOOKBACK_DAYS: '30'
        run: python scripts/collect_finpy_tse.py
      - name: Collect alternative provider - algotik_tse
        continue-on-error: true
        env:
          OPTION_UNDERLYINGS: 'فملی,ذوب,وبملت,شپنا,خساپا,فولاد,فغدیر,سرچشمه'
          ALGOTIK_FETCH_OI: 'true'
        run: python scripts/collect_algotik_tse.py
      - name: Collect alternative provider - 5j9/tsetmc
        continue-on-error: true
        run: python scripts/collect_tsetmc_async.py
      - name: Collect alternative provider - TSETMC_OPTION API
        continue-on-error: true
        run: python scripts/collect_tsetmc_option_api.py
      - name: Collect primary option chain - tse-option
        env:
          OPTION_SYMBOL: ${{ inputs.symbol || 'فملی' }}
          OPTION_INCLUDE_GREEKS: ${{ inputs.include_greeks || 'true' }}
        run: python scripts/collect_tse_option_chain.py
      - name: Validate provider snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          checks = {
              'data/raw/algotik_tse_snapshot.json': 'algotik_tse',
              'data/raw/tsetmc_async_snapshot.json': '5j9/tsetmc',
              'data/raw/tsetmc_option_api_snapshot.json': 'TSETMC_OPTION API',
              'data/raw/tse_option_chain.json': 'tse-option',
          }
          failures = []
          for name, label in checks.items():
              p = Path(name)
              if not p.exists():
                  failures.append(f'{label}: missing')
                  continue
              d = json.loads(p.read_text(encoding='utf-8'))
              print(f'{label}: status={d.get("status")}')
              if label == 'tse-option':
                  rows = d.get('rows') or d.get('data') or []
                  if d.get('status') != 'ok' or not rows:
                      failures.append(f'{label}: no valid rows')
          if failures:
              raise SystemExit('Primary option provider invalid: ' + '; '.join(failures))
          PY
      - name: Ingest and rank options
        run: |
          python scripts/ingest_option_market_watch.py
          python scripts/ingest_marketwatch_plus.py
          python scripts/ingest_tse_option.py
          python scripts/rank_options_babimind.py
          python scripts/score_options_babimind_scenarios.py
          python scripts/risk_adjusted_options_babimind.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/ reports/options_babimind* reports/marketwatch_plus_summary.json reports/tse_option_source_status.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'data: refresh TSE market and option intelligence' && git push origin HEAD:main)
