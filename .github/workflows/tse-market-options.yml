name: TSE Market and Options Live

on:
  push:
    paths:
      - '.github/workflows/tse-market-options.yml'
      - 'scripts/ingest_tse_option.py'
      - 'scripts/rank_options_babimind.py'
      - 'scripts/collect_algotik_tse.py'
      - 'scripts/collect_tsetmc_async.py'
      - 'scripts/collect_tsetmc_option_api.py'
      - 'requirements-market-data.txt'
      - 'requirements.txt'
  schedule:
    - cron: '*/30 5-9 * * 6,0,1,2,3'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Underlying symbol'
        required: false
        default: 'فملی'
        type: string

permissions:
  contents: write

env:
  ALGOTIK_FETCH_OI: 'true'

jobs:
  market-options:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install data stack
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pandas numpy scipy requests jalali_pandas
          if [ -f requirements-market-data.txt ]; then python -m pip install -r requirements-market-data.txt; fi
      - name: Collect alternative provider - algotik_tse
        continue-on-error: true
        env:
          OPTION_UNDERLYINGS: 'فملی,ذوب,وبملت,شپنا,خساپا,فولاد,فغدیر,سرچشمه'
          ALGOTIK_FETCH_OI: 'true'
        run: python scripts/collect_algotik_tse.py
      - name: Collect alternative provider - 5j9/tsetmc
        continue-on-error: true
        run: python scripts/collect_tsetmc_async.py
      - name: Collect alternative provider - TSETMC_OPTION API
        continue-on-error: true
        run: python scripts/collect_tsetmc_option_api.py
      - name: Validate provider snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          checks = {
              'data/raw/algotik_tse_snapshot.json': 'algotik_tse',
              'data/raw/tsetmc_async_snapshot.json': '5j9/tsetmc',
              'data/raw/tsetmc_option_api_snapshot.json': 'TSETMC_OPTION API',
          }
          ok_count = 0
          report = []
          for name, label in checks.items():
              p = Path(name)
              if not p.exists():
                  report.append(f'{label}: missing')
                  continue
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  report.append(f'{label}: invalid json ({e})')
                  continue
              status = d.get('status')
              rows = d.get('rows') or d.get('data') or []
              print(f'{label}: status={status} rows={len(rows) if isinstance(rows, list) else "n/a"}')
              if status == 'ok' and rows:
                  ok_count += 1
                  report.append(f'{label}: ok')
              else:
                  report.append(f'{label}: partial/empty (status={status})')
          print('SUMMARY:', '; '.join(report))
          Path('reports').mkdir(parents=True, exist_ok=True)
          Path('reports/tse_option_source_status.json').write_text(
              json.dumps({'status': 'ok' if ok_count == len(checks) else ('partial_ok' if ok_count else 'all_providers_failed'), 'ok_count': ok_count, 'provider_count': len(checks), 'report': report}, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
      - name: Ingest and rank options
        continue-on-error: true
        run: |
          python scripts/ingest_option_market_watch.py || true
          python scripts/ingest_marketwatch_plus.py || true
          python scripts/ingest_tse_option.py || true
          python scripts/rank_options_babimind.py || true
          python scripts/score_options_babimind_scenarios.py || true
          python scripts/risk_adjusted_options_babimind.py || true
      - name: Commit outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/ reports/options_babimind* reports/marketwatch_plus_summary.json reports/tse_option_source_status.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'data: refresh TSE market and option intelligence' && git push origin HEAD:main)
