name: BRS API check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 5-9 * * 0-4"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Query BRS API
        run: python scripts/brsapi_client.py
