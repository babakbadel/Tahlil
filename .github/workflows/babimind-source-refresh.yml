name: BabiMind Source Architecture Refresh

on:
  schedule:
    # Every 4 days at 06:00 UTC
    - cron: '0 6 */4 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-source-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh source catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('docs/data_sources_global_intelligence.md')
          if not p.exists():
              raise SystemExit('Source catalog not found')
          stamp = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          text = p.read_text(encoding='utf-8')
          marker = '\n\n---\n\n## Automated refresh metadata\n'
          if marker in text:
              text = text.split(marker)[0]
          text += marker + f'Last catalog refresh: {stamp}\n\nRefresh cadence: every 4 days\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit refresh if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data_sources_global_intelligence.md
          git diff --cached --quiet && echo 'No changes to commit.' || git commit -m 'chore: refresh BabiMind source catalog'
          git push
